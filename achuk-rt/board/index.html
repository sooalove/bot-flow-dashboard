<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><script>(()=>{const B='20261107103000';const chk=()=>fetch('version.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.b&&j.b!==B&&sessionStorage.getItem('rtbvr')!==j.b){sessionStorage.setItem('rtbvr',j.b);const u=new URL(location.href);u.searchParams.set('v',j.b);location.replace(u.toString())}}).catch(()=>{});chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})})()</script><title>아축 점수판 미리보기</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#fff;color:#111;font-family:"Avenir Next","Futura","Helvetica Neue",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;color-scheme:light}
#app{height:100%;display:flex;flex-direction:column;padding:0 0 max(76px,calc(48px + env(safe-area-inset-bottom)))}
.util{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));background:#f5f5f5;border-bottom:1px solid #e5e5e5;color:#111;font-size:14px;font-weight:500;letter-spacing:.04em}
.util b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.board{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:48px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left));background:#fff}
.side{min-width:0}
.side.A{order:1;text-align:left}
.side.B{order:3;text-align:right}
.side h2{font-size:clamp(40px,6vh,72px);font-weight:500;line-height:1;letter-spacing:.06em;margin-bottom:8px}
.side.A h2,.side.A .sc{color:#111}
.side.B h2,.side.B .sc{color:#06275c}
.sc{font-size:min(33vh,18vw);font-weight:700;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-block;max-width:100%}
.sep{order:2;align-self:end;padding:0 24px .12em;font-size:32px;font-weight:500;line-height:1.2;color:#111}
.board.sw .A{order:3;text-align:right}
.board.sw .B{order:1;text-align:left}
#fx{min-height:28px;margin:0 max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left));pointer-events:none}
#fx[hidden]{display:block;visibility:hidden}
#fx b{display:inline-block;font-size:16px;font-weight:500;line-height:1.5;letter-spacing:0;color:#111}
#fx.goal b{animation:cut .42s ease}
#fx.soft b{animation:cut .32s ease}
.sc.pop{animation:cut .42s cubic-bezier(.2,.7,.2,1)}
@keyframes cut{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#swb,#recb{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));min-height:48px;min-width:48px;padding:0 32px;border:0;border-radius:999px;font:500 16px/1.2 "Avenir Next","Helvetica Neue",-apple-system,sans-serif;touch-action:manipulation;z-index:6}
#swb{left:50%;transform:translateX(-50%);background:#ffc65a;color:#111}
#recb{right:max(16px,env(safe-area-inset-right));background:#111;color:#fff;z-index:7}
#swb:active{transform:translateX(-50%) scale(.98)}
#recb:active{transform:scale(.98)}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(17,17,17,.28);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
#sheet .panel{width:min(880px,100%);margin:0 auto;max-height:46vh;overflow:auto;background:#fff;border-top:1px solid #cacacb;padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
#sheet h3{font-size:32px;font-weight:500;line-height:1.2;margin-bottom:8px}
#sheet .hint{font-size:16px;font-weight:400;line-height:1.5;color:#111;margin-bottom:16px}
#sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
#sheet .tl{font-size:16px;font-weight:500;letter-spacing:.06em;margin-bottom:8px}
#sheet .pc,#sheet .kinds button,#sheet .ghost,#toast button{min-height:48px;border:0;border-radius:999px;font:500 16px/1.2 "Avenir Next","Helvetica Neue",-apple-system,sans-serif;touch-action:manipulation}
#sheet .pc{padding:0 18px;margin:0 8px 8px 0}
#sheet .pc.A{background:#111;color:#fff}
#sheet .pc.B{background:#06275c;color:#fff}
#sheet .pc.sel{outline:2px solid #111;outline-offset:3px}
#sheet .kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
#sheet .kinds button{background:#f5f5f5;color:#111}
#sheet .row{display:flex;justify-content:flex-end;margin-top:16px}
#sheet .ghost{background:#fff;color:#111;padding:0 24px;border:1px solid #111}
#toast{position:fixed;left:50%;bottom:max(76px,12vh);transform:translateX(-50%);z-index:40;background:#fff;color:#111;border-top:1px solid #cacacb;padding:12px 16px;font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center}
#toast[hidden]{display:none}
#toast button{background:#111;color:#fff;padding:0 16px}
@media (orientation:portrait){
 .board{grid-template-columns:1fr;grid-template-rows:auto auto auto;align-items:start;padding-top:24px;gap:8px}
 .sep{display:none}
 .side,.board.sw .A,.board.sw .B{text-align:left}
 .sc{font-size:min(26vh,40vw)}
 #swb{left:auto;right:max(16px,env(safe-area-inset-right));top:42%;bottom:auto;transform:none}
 #swb:active{transform:scale(.98)}
 #sheet .kinds{grid-template-columns:1fr 1fr}
 #sheet .panel{max-height:42vh}
}
@media (prefers-reduced-motion:reduce){#fx.goal b,#fx.soft b,.sc.pop{animation:none}}
</style></head><body><div id="app"></div>
<script>
// 미리보기 전용. 서버 저장소에 기록하지 않는다.
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// RECORD-LOGIC-BEGIN
const REC_KINDS=['골','어시','자책골','세이브','유효슈팅','철벽수비'];
function recLabel(k){return k==='세이브'?'슈퍼세이브':k}
function scoreFromEvents(ev, match){
  if(match&&match.base) return [+match.sa||0, +match.sb||0];
  const seen={}; let a=0,b=0;
  (ev||[]).forEach(g=>{
    if(!g) return;
    const id=g.eid||g.eventId||'';
    if(id){ if(seen[id]) return; seen[id]=1; }
    if(g.k==='골'){ if(g.t==='A') a++; else b++; }
    else if(g.k==='자책골'){ if(g.t==='A') b++; else a++; }
    else if(g.k==='상대골') b++;
  });
  return [a,b];
}
function applyPersistedEvent(match, ev){
  const m=JSON.parse(JSON.stringify(match||{}));
  const goals=Array.isArray(m.goals)?m.goals:[];
  if(!goals.some(g=>g&&(g.eid===ev.eid||g.eventId===ev.eid))) goals.push({p:ev.p,k:ev.k,t:ev.t,eid:ev.eid,ts:ev.ts||0});
  m.goals=goals;
  if(!m.base){ const sc=scoreFromEvents(goals, m); m.sa=sc[0]; m.sb=sc[1]; }
  return m;
}
function entryAllowed(match, p, k, t){
  if(!match||match.deleted) return false;
  if(k==='상대골') return match.type==='external' && t==='B';
  if(REC_KINDS.indexOf(k)<0) return false;
  if(t!=='A'&&t!=='B') return false;
  return ((match[t]&&match[t].players)||[]).indexOf(p)>=0;
}
function tapGuard(state, key, now){
  const s=state||{busyKey:null,lastKey:'',lastTs:0,lastOk:false};
  if(s.busyKey) return {ok:false, reason:'busy', state:s};
  if(s.lastOk && s.lastKey===key && now-s.lastTs<800) return {ok:false, reason:'dup', state:s};
  return {ok:true, state:{busyKey:key, lastKey:key, lastTs:now, lastOk:false}};
}
function finishGuard(state, ok){return {busyKey:null, lastKey:state.lastKey, lastTs:state.lastTs, lastOk:!!ok}}
function createRecorder(){
  let guard={busyKey:null,lastKey:'',lastTs:0,lastOk:false};
  return {async add(match, ev, key, fetchImpl, now){
    if(!entryAllowed(match, ev.p, ev.k, ev.t)) return {ok:false, reason:'reject', match};
    const g=tapGuard(guard, ev.p+'|'+ev.k+'|'+ev.t, now==null?Date.now():now);
    if(!g.ok) return {ok:false, reason:g.reason, match};
    guard=g.state;
    let res; try{ res=await fetchImpl({op:'addEvent', id:match.id, eventId:ev.eid, p:ev.p, k:ev.k, t:ev.t}); }
    catch(e){ res={ok:false}; }
    guard=finishGuard(guard, !!(res&&res.ok&&res.applied));
    if(!res||res.ok!==true||res.applied!==true) return {ok:false, reason:'fail', match};
    return {ok:true, reason:'saved', match:applyPersistedEvent(res.match||match, ev)};
  }};
}
// RECORD-LOGIC-END
// FX-BEGIN
function fxTone(k){return (k==='골'||k==='자책골'||k==='상대골')?'goal':'soft'}
function fxAdmit(e, seen, force, started){
  const id=e&&e.eid; const cur=seen||{};
  if(!id) return {play:false, seen:cur};
  if(cur[id]) return {play:false, seen};
  const next=Object.assign({}, cur); next[id]=1;
  if(!force && (!(e.ts>0) || e.ts<started)) return {play:false, seen:next};
  return {play:true, seen:next, tone:fxTone(e.k)};
}
function scoreSide(e){if(!e)return '';if(e.k==='골')return e.t==='A'?'A':'B';if(e.k==='자책골')return e.t==='A'?'B':'A';if(e.k==='상대골')return 'B';return e.t==='B'?'B':'A'}
// FX-END
const FXSTART=Date.now();
let FXSEEN={},M=null,SW=false,SEL=null,ASST=null,SHEET=false;
try{SW=localStorage.getItem('achuk_preview_sw')==='1'}catch(e){}
const REC=createRecorder();
function previewSeed(){
  const today=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  return {id:'preview-board',date:today,type:'internal',kick:Date.now()-12*60*1000,A:{name:'블랙',players:['김','이','박']},B:{name:'블루',players:['최','정','한']},goals:[
    {eid:'seed-a',p:'김',k:'골',t:'A',ts:Date.now()-8*60*1000},
    {eid:'seed-b',p:'최',k:'골',t:'B',ts:Date.now()-4*60*1000}
  ]};
}
async function postJSON(body){
  if(window.__mode==='fail') return {ok:false, error:'mock'};
  if(body.op==='addEvent'){
    const goals=(M.goals||[]).concat([{p:body.p,k:body.k,t:body.t,eid:body.eventId,ts:Date.now()}]);
    return {ok:true, applied:true, match:Object.assign({}, M, {goals})};
  }
  if(body.op==='removeEvent'){
    return {ok:true, applied:true, match:Object.assign({}, M, {goals:(M.goals||[]).filter(g=>g.eid!==body.eventId)})};
  }
  return {ok:false, applied:false};
}
function newEid(){const a='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';const b=crypto.getRandomValues(new Uint8Array(20));let s='';for(let i=0;i<20;i++)s+=a[b[i]%a.length];return s}
function toast(msg,undo){const el=$('#toast');if(!el)return;el.hidden=false;el.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button type="button" id="undob">되돌리기</button>':'');clearTimeout(el._t);el._t=setTimeout(()=>{el.hidden=true},undo?6000:2200);if(undo){const b=$('#undob');if(b)b.onclick=undo}}
function playFx(e, force){const r=fxAdmit(e, FXSEEN, !!force, FXSTART);FXSEEN=r.seen;if(!r.play)return;showFx(e, r.tone)}
function showFx(e, tone){const el=$('#fx');if(!el||!M)return;const side=scoreSide(e);const word=side==='B'?'블루':'블랙';
 el.hidden=false;el.className=tone==='goal'?'goal':'soft';el.querySelector('b').textContent=`${recLabel(e.k)} · ${e.p||''} · ${word}`;
 if(tone==='goal'){const sc=side==='B'?$('#sb'):$('#sa');if(sc){sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop')}}
 clearTimeout(el._t);el._t=setTimeout(()=>{el.hidden=true;el.className=''},1600)}
function paintSheet(){const el=$('#sheet');if(!el||!M)return;if(!SHEET){el.hidden=true;return}el.hidden=false;
 const chips=sd=>((M[sd]&&M[sd].players)||[]).map(p=>`<button type="button" class="pc ${sd}${SEL&&SEL.p===p&&SEL.t===sd?' sel':''}" data-p="${esc(p)}" data-t="${sd}">${esc(p)}</button>`).join('');
 const kinds=REC_KINDS.map(k=>`<button type="button" data-k="${k}">${esc(recLabel(k))}</button>`).join('');
 const as=ASST&&ASST.until>Date.now()?`<div class="hint">${esc(ASST.scorer)} 골. 어시스트는 점수에 더하지 않아요.</div>${(M[ASST.t].players||[]).filter(p=>p!==ASST.scorer).map(p=>`<button type="button" class="pc ${ASST.t}" data-as="${esc(p)}">${esc(p)}</button>`).join('')}<button type="button" class="ghost" id="asnone">어시 없음</button>`:'';
 el.innerHTML=`<div class="panel" role="dialog" aria-label="기록 등록"><h3>기록</h3><div class="hint">선수를 고른 뒤 종류를 누르세요. 점수는 저장 후에만 바뀝니다.</div><div class="cols"><div><div class="tl">블랙</div>${chips('A')}</div><div><div class="tl">블루</div>${chips('B')}</div></div>${as}<div class="kinds">${kinds}</div><div class="hint" id="rst">${SEL?esc(SEL.p):'선수'}</div><div class="row"><button type="button" class="ghost" id="sheetx">닫기</button></div></div>`;
 el.onclick=e=>{if(e.target===el){SHEET=false;el.hidden=true}};
 const panel=el.querySelector('.panel');if(panel)panel.onclick=e=>e.stopPropagation();
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p,t=b.dataset.t;SEL=SEL&&SEL.p===p&&SEL.t===t?null:{p,t};paintSheet()});
 el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>chooseKind(b.dataset.k));
 el.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{const p=b.dataset.as,t=ASST&&ASST.t;ASST=null;if(p&&t)commitRec(p,'어시',t);else paintSheet()});
 const none=$('#asnone');if(none)none.onclick=()=>{ASST=null;paintSheet()};
 $('#sheetx').onclick=()=>{SHEET=false;el.hidden=true}}
async function commitRec(p,k,t){if(!M)return;const ev={eid:newEid(),p,k,t,ts:Date.now()};const res=await REC.add(M,ev,'preview',postJSON,Date.now());
 if(!res.ok){if(res.reason==='fail')toast('저장되지 않았어요. 점수는 그대로입니다.');return}
 M=res.match;render();playFx(ev,true);SEL=null;
 if(k==='골'){ASST={t,scorer:p,until:Date.now()+8000};setTimeout(()=>{if(ASST&&ASST.scorer===p){ASST=null;if(SHEET)paintSheet()}},8100)}else ASST=null;
 if(SHEET)paintSheet();
 toast('저장됐어요',async()=>{const rm=await postJSON({op:'removeEvent',id:M.id,eventId:ev.eid});if(!rm.ok||!rm.applied){toast('삭제되지 않았어요. 점수는 그대로입니다.');return}M=rm.match;if(ASST&&ASST.scorer===p)ASST=null;render();if(SHEET)paintSheet();toast('되돌렸어요')})}
function chooseKind(k){if(!SEL){toast('먼저 선수를 탭하세요');return}commitRec(SEL.p,k,SEL.t)}
function render(){if(!M)return;const [a,b]=scoreFromEvents(M.goals||[],M);
 if(!$('#sa')){$('#app').innerHTML=`<header class="util"><span>아축</span><span><b id="clk">00:00</b> 경과</span><span>미리보기 · 실제 경기에는 저장되지 않아요</span></header><div class="board${SW?' sw':''}" id="brd"><section class="side A"><h2>${esc(M.A.name)}</h2><div class="sc" id="sa">0</div></section><div class="sep" aria-hidden="true">:</div><section class="side B"><h2>${esc(M.B.name)}</h2><div class="sc" id="sb">0</div></section></div><div id="fx" hidden><b></b></div><button id="swb" type="button" aria-label="좌우 바꾸기">⇄ 좌우 바꾸기</button><button id="recb" type="button" aria-label="기록 등록">기록</button><div id="sheet" hidden></div><div id="toast" hidden></div>`;
  $('#swb').onclick=()=>{SW=!SW;try{localStorage.setItem('achuk_preview_sw',SW?'1':'')}catch(e){}$('#brd').classList.toggle('sw',SW)};
  $('#recb').onclick=()=>{SHEET=!SHEET;paintSheet()}}
 [['sa',a],['sb',b]].forEach(([id,v])=>{const el=$('#'+id);if(el&&el.textContent!==String(v))el.textContent=v})}
function tick(){const el=$('#clk');if(!el||!M)return;const s=Math.max(0,Math.floor((Date.now()-M.kick)/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(tick,1000);
M=previewSeed();(M.goals||[]).forEach(e=>{if(e.eid)FXSEEN[e.eid]=1});render();tick();
</script></body></html>
