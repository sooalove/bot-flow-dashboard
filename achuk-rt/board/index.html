<script>
// 아축 아이패드 점수판. 점수 = 저장된 경기 기록(골·자책골·상대골)만. 어시·슈퍼세이브는 득점 없음. 폴링 없음.
let STORE='';
// CRYPTO-BEGIN (kept self-contained so test_pages_crypto.mjs can run exactly this code in node)
// File format: {v:1, alg:'PBKDF2-SHA256/AES-256-GCM', salt, iter, iv, ct, updated}  (salt/iv/ct = base64; ct includes the GCM tag)
// Passphrase = #k=<key> from the URL fragment (fragments are never sent to the server).
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYC = {salt:null, iter:0, pass:null, key:null};
async function aesKey(pass, salt, iter){
  if(KEYC.key && KEYC.salt===salt && KEYC.iter===iter && KEYC.pass===pass) return KEYC.key; // derive once
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(salt), iterations:iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  Object.assign(KEYC, {salt, iter, pass, key}); return key;
}
async function decryptDoc(doc, pass){
  if(!doc || doc.v!==1 || !doc.salt || !doc.iv || !doc.ct || !(doc.iter>0)) throw new Error('형식 오류');
  const key = await aesKey(pass, doc.salt, doc.iter);
  let pt;
  try{ pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(doc.iv)}, key, b64d(doc.ct)); }
  catch(e){ const err=new Error('키 불일치'); err.badKey=true; throw err; }
  return JSON.parse(new TextDecoder().decode(pt));
}
// CRYPTO-END
// RECORD-LOGIC-BEGIN
const REC_KINDS=['골','어시','자책골','세이브','유효슈팅','철벽수비'];
function recLabel(k){return k==='세이브'?'슈퍼세이브':k}
function assertAnon(obj){
  const bad=['uid','user','writer','device','deviceId','by'];
  for(const k of bad) if(obj&&Object.prototype.hasOwnProperty.call(obj,k)) throw new Error('identity');
  return obj;
}
function scoreFromEvents(ev, match){
  if(match&&match.base) return [+match.sa||0, +match.sb||0];
  const seen={}; let a=0,b=0;
  (ev||[]).forEach(g=>{
    if(!g) return;
    const id=g.eid||g.eventId||'';
    if(id){ if(seen[id]) return; seen[id]=1; }
    if(g.k==='골'){ if(g.t==='A') a++; else b++; }
    else if(g.k==='자책골'){ if(g.t==='A') b++; else a++; }
    else if(g.k==='상대골') b++;
  });
  return [a,b];
}
function persistedEvents(match, live, removed){
  const rm=Object.assign({}, (match&&match.removedEvents)||{}, removed||{});
  const out={};
  ((match&&match.goals)||[]).forEach((g,i)=>{
    const eid=g&&(g.eid||g.eventId||('legacy-'+i));
    if(!eid||rm[eid]) return;
    out[eid]=Object.assign({}, g, {eid});
  });
  Object.keys(live||{}).forEach(k=>{
    const e=live[k]; if(!e) return;
    const eid=e.eid||e.eventId||k;
    if(!eid||rm[eid]||out[eid]||e.saved===false) return;
    out[eid]=Object.assign({}, e, {eid});
  });
  return Object.values(out);
}
function applyPersistedEvent(match, ev){
  const m=JSON.parse(JSON.stringify(match||{}));
  const goals=Array.isArray(m.goals)?m.goals:[];
  if(!goals.some(g=>g&&(g.eid===ev.eid||g.eventId===ev.eid))) goals.push({p:ev.p,k:ev.k,t:ev.t,eid:ev.eid,ts:ev.ts||0});
  m.goals=goals;
  if(!m.base){ const sc=scoreFromEvents(goals, m); m.sa=sc[0]; m.sb=sc[1]; }
  return m;
}
function addEventRequest(key, match, ev){
  return assertAnon({key:key, op:'addEvent', id:match.id, eventId:ev.eid, p:ev.p, k:ev.k, t:ev.t});
}
function removeEventRequest(key, match, eventId){
  return assertAnon({key:key, op:'removeEvent', id:match.id, eventId:eventId});
}
function livePayload(ev){ return assertAnon({p:ev.p, k:ev.k, t:ev.t}); }
function entryAllowed(match, p, k, t){
  if(!match||match.deleted||String(match.id||'').startsWith('pv-')) return false;
  if(k==='상대골') return match.type==='external' && t==='B';
  if(REC_KINDS.indexOf(k)<0) return false;
  if(t!=='A'&&t!=='B') return false;
  const roster=(match[t]&&match[t].players)||[];
  return roster.indexOf(p)>=0;
}
function tapGuard(state, key, now){
  const s=state||{busyKey:null,lastKey:'',lastTs:0,lastOk:false};
  if(s.busyKey) return {ok:false, reason:'busy', state:s};
  if(s.lastOk && s.lastKey===key && now-s.lastTs<800) return {ok:false, reason:'dup', state:s};
  return {ok:true, state:{busyKey:key, lastKey:key, lastTs:now, lastOk:false}};
}
function finishGuard(state, ok){
  return {busyKey:null, lastKey:state.lastKey, lastTs:state.lastTs, lastOk:!!ok};
}
async function saveRecord(match, ev, key, fetchImpl){
  const request=addEventRequest(key, match, ev);
  let j;
  try{ j=await fetchImpl(request); }
  catch(e){ return {ok:false, match:match, error:(e&&e.message)||'fail'}; }
  if(!j||j.ok!==true||j.applied!==true) return {ok:false, match:match, error:(j&&j.error)||'fail'};
  const base=(j.match&&typeof j.match==='object')?j.match:match;
  return {ok:true, match:applyPersistedEvent(base, ev), request:request};
}
async function deleteRecord(match, eventId, key, fetchImpl){
  const request=removeEventRequest(key, match, eventId);
  let j;
  try{ j=await fetchImpl(request); }
  catch(e){ return {ok:false, match:match, error:(e&&e.message)||'fail'}; }
  if(!j||j.ok!==true||j.applied!==true) return {ok:false, match:match, error:(j&&j.error)||'fail'};
  const m=JSON.parse(JSON.stringify((j.match&&typeof j.match==='object')?j.match:match));
  m.removedEvents=Object.assign({}, m.removedEvents, {[eventId]:1});
  m.goals=(m.goals||[]).filter(g=>g&&g.eid!==eventId);
  if(!m.base){ const sc=scoreFromEvents(m.goals, m); m.sa=sc[0]; m.sb=sc[1]; }
  return {ok:true, match:m, request:request};
}
function createRecorder(){
  let guard={busyKey:null,lastKey:'',lastTs:0,lastOk:false};
  return {
    async add(match, ev, key, fetchImpl, now){
      if(!entryAllowed(match, ev.p, ev.k, ev.t)) return {ok:false, reason:'reject', match:match};
      const tap=ev.p+'|'+ev.k+'|'+ev.t;
      const g=tapGuard(guard, tap, now==null?Date.now():now);
      if(!g.ok) return {ok:false, reason:g.reason, match:match};
      guard=g.state;
      let res;
      try{ res=await saveRecord(match, ev, key, fetchImpl); }
      catch(e){ res={ok:false, match:match, error:String(e&&e.message||e)}; }
      guard=finishGuard(guard, !!(res&&res.ok));
      if(!res.ok) return {ok:false, reason:'fail', match:match, error:res.error};
      return {ok:true, reason:'saved', match:res.match, request:res.request};
    }
  };
}
// RECORD-LOGIC-END
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10),Q=new URLSearchParams(location.search);
let KEY=(new URLSearchParams(location.hash.slice(1))).get('k')||'';
try{if(KEY){localStorage.setItem('achuk_k',KEY);history.replaceState(null,'',location.pathname+location.search)}else KEY=localStorage.getItem('achuk_k')||''}catch(e){}
function keyForm(msg){$('#app').innerHTML=`<div class="keyf"><b>🔑 처음 한 번만 키를 입력해 주세요</b>${msg?`<div class="err">${msg}</div>`:''}<input id="kin" type="password" autocomplete="off" placeholder="키 또는 #k= 링크 붙여넣기"><button id="kok">저장하고 열기</button><small>이 기기에만 저장돼요</small></div>`;
 $('#kok').onclick=()=>{let v=$('#kin').value.trim();const m=v.match(/[#&]k=([^&]+)/);if(m)v=decodeURIComponent(m[1]);if(!v)return;try{localStorage.setItem('achuk_k',v)}catch(e){}KEY=v;load()}}
let DB={},M=null,EV={},RM={},F=null,d=null,space='',KICK=0;
async function get(){const r=await fetch(STORE,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:KEY,op:'get',matches:{}})});const j=await r.json();if(!j.ok)throw new Error(j.error||'server');DB=j.matches||{}}
function pick(){const q=Q.get('m');if(q&&/^pv-/.test(q))return{id:q,date:TODAY(),A:{name:'블랙'},B:{name:'블루'},goals:[]};
 if(q&&DB[q])return DB[q];const t=Q.get('d')||TODAY();return Object.values(DB).filter(x=>x&&!x.deleted&&String(x.date).slice(0,10)===t).sort((a,b)=>(+String(b.id).slice(2)||0)-(+String(a.id).slice(2)||0))[0]||null}
function events(){if(!M)return [];return persistedEvents(M,EV,RM)}
function score(){return scoreFromEvents(events(), M)}
let LAST=null,SW=false;try{SW=localStorage.getItem('achuk_board_sw')==='1'}catch(e){}
function canRec(){if(!M||!STORE||M.deleted||String(M.id).startsWith('pv-'))return false;if(String(M.date||'').slice(0,10)<TODAY())return false;if(M.type==='external')return true;return ((M.A&&M.A.players)||[]).length+((M.B&&M.B.players)||[]).length>0}
function newEid(){const alphabet='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';const bytes=crypto.getRandomValues(new Uint8Array(20));let s='';for(let i=0;i<20;i++)s+=alphabet[bytes[i]%alphabet.length];return s}
function toast(msg,undo){const el=$('#toast');if(!el)return;el.hidden=false;el.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button type="button" id="undob">되돌리기</button>':'');clearTimeout(el._t);el._t=setTimeout(()=>{el.hidden=true},undo?6000:2200);if(undo){const b=$('#undob');if(b)b.onclick=undo}}
async function postJSON(body){const r=await fetch(STORE,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});let j=null;try{j=await r.json()}catch(e){throw new Error('bad-response')}return j}
function publishLive(ev){if(!F||!d||!space||!M)return;const payload=livePayload(ev);F.set(F.ref(d,`achuk/${space}/live/${M.id}/events/${ev.eid}`),Object.assign({},payload,{ts:F.serverTimestamp()})).catch(()=>{});F.runTransaction(F.ref(d,`achuk/${space}/live/${M.id}/seq`),n=>(n||0)+1).catch(()=>{})}
function publishRemoved(eventId){if(!F||!d||!space||!M)return;if(!/^[-_A-Za-z0-9]{20}$/.test(eventId))return;F.set(F.ref(d,`achuk/${space}/live/${M.id}/removed/${eventId}`),F.serverTimestamp()).catch(()=>{})}
const REC=createRecorder();
let SEL=null,ASST=null,SHEET=false;
function paintSheet(){const el=$('#sheet');if(!el||!M)return;if(!SHEET){el.hidden=true;return}el.hidden=false;
 const chips=sd=>((M[sd]&&M[sd].players)||[]).map(p=>`<button type="button" class="pc ${sd}${SEL&&SEL.p===p&&SEL.t===sd?' sel':''}" data-p="${esc(p)}" data-t="${sd}">${esc(p)}</button>`).join('')||'<div class="hint">선수 없음</div>';
 const kinds=REC_KINDS.map(k=>`<button type="button" data-k="${k}">${esc(recLabel(k))}</button>`).join('');
 const opp=M.type==='external'?'<button type="button" class="pc B" id="opp">⚽ 상대팀 득점</button>':'';
 const as=ASST&&ASST.until>Date.now()?`<div class="hint">⚽ ${esc(ASST.scorer)} 골 · 어시스트는? (점수는 그대로)</div>${((M[ASST.t]&&M[ASST.t].players)||[]).filter(p=>p!==ASST.scorer).map(p=>`<button type="button" class="pc ${ASST.t}" data-as="${esc(p)}">${esc(p)}</button>`).join('')}<button type="button" class="ghost" id="asnone">어시 없음</button>`:'';
 el.innerHTML=`<div class="panel" role="dialog" aria-label="기록 등록"><h3>기록 등록</h3><div class="hint">선수를 고른 뒤 종류를 누르면 저장돼요. 점수는 저장이 끝난 뒤에만 바뀌어요.</div><div class="cols"><div><div class="tl">⚫ ${esc(M.A&&M.A.name||'A')}</div>${chips('A')}</div><div><div class="tl" style="color:#60a5fa">🔵 ${esc(M.B&&M.B.name||'B')}</div>${M.type==='external'?opp:chips('B')}</div></div>${as}<div class="kinds">${kinds}</div><div class="hint" id="rst">${SEL?esc(SEL.p)+' 선택됨 · 종류를 누르면 저장':'선수를 먼저 고르세요'}</div><div class="row"><span></span><button type="button" class="ghost" id="sheetx">닫기</button></div></div>`;
 el.onclick=e=>{if(e.target===el){SHEET=false;el.hidden=true}};

 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p,t=b.dataset.t;SEL=SEL&&SEL.p===p&&SEL.t===t?null:{p,t};paintSheet()});
 el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>chooseKind(b.dataset.k));
 el.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{const p=b.dataset.as,t=ASST&&ASST.t;ASST=null;if(p&&t)commitRec(p,'어시',t);else paintSheet()});
 const none=$('#asnone');if(none)none.onclick=()=>{ASST=null;paintSheet()};
 const oppB=$('#opp');if(oppB)oppB.onclick=()=>commitRec(M.B&&M.B.name||'상대팀','상대골','B');
 const x=$('#sheetx');if(x)x.onclick=()=>{SHEET=false;el.hidden=true}}
async function commitRec(p,k,t){if(!M)return;const ev={eid:newEid(),p,k,t,ts:Date.now()};const res=await REC.add(M,ev,KEY,postJSON,Date.now());
 if(!res.ok){if(res.reason==='fail')toast('저장되지 않았어요. 점수는 그대로입니다.');else if(res.reason==='reject')toast('이 기록은 저장할 수 없어요');const st=$('#rst');if(st&&res.reason==='fail')st.textContent='저장 실패 · 점수 유지';return}
 M=res.match;if(M&&M.id)DB[M.id]=M;render();playFx(ev,true);publishLive(ev);SEL=null;
 if(k==='골'&&M[t]&&(M[t].players||[]).length>1){ASST={t,scorer:p,until:Date.now()+8000};setTimeout(()=>{if(ASST&&ASST.scorer===p){ASST=null;if(SHEET)paintSheet()}},8100)}else ASST=null;
 if(SHEET)paintSheet();
 toast('저장됐어요',async()=>{const rm=await deleteRecord(M,ev.eid,KEY,postJSON);if(!rm.ok){toast('삭제되지 않았어요. 점수는 그대로입니다.');return}M=rm.match;if(M&&M.id)DB[M.id]=M;RM[ev.eid]=1;delete EV[ev.eid];if(ASST&&ASST.scorer===p)ASST=null;render();publishRemoved(ev.eid);if(SHEET)paintSheet();toast('되돌렸어요')})}
function chooseKind(k){if(!SEL){toast('먼저 선수를 탭하세요');const st=$('#rst');if(st)st.textContent='선수를 먼저 고르세요';return}commitRec(SEL.p,k,SEL.t)}
// FX-BEGIN
const FXSTART=Date.now();
let FXSEEN={};
function fxTone(k){return (k==='골'||k==='자책골'||k==='상대골')?'goal':'soft'}
function fxAdmit(e, seen, force, started){
  const id=e&&e.eid; const cur=seen||{};
  if(!id) return {play:false, seen:cur};
  if(cur[id]) return {play:false, seen:cur};
  const next=Object.assign({}, cur); next[id]=1;
  if(!force && (!(e.ts>0) || e.ts<started)) return {play:false, seen:next};
  return {play:true, seen:next, tone:fxTone(e.k)};
}
function scoreSide(e){if(!e)return '';if(e.k==='골')return e.t==='A'?'A':'B';if(e.k==='자책골')return e.t==='A'?'B':'A';if(e.k==='상대골')return 'B';return e.t==='B'?'B':'A'}
// FX-END
function playFx(e, force){const r=fxAdmit(e, FXSEEN, !!force, FXSTART); FXSEEN=r.seen; if(!r.play)return; showFx(e, r.tone)}
function showFx(e, tone){const el=$('#fx'); if(!el||!M)return; const side=scoreSide(e); const word=side==='B'?'블루':'블랙'; const team=side==='B'?(M.B&&M.B.name||'블루'):(M.A&&M.A.name||'블랙');
 el.hidden=false; el.className=tone==='goal'?'goal':'soft';
 const b=el.querySelector('b')||el.appendChild(document.createElement('b'));
 b.textContent=`${recLabel(e.k)} · ${e.p||''} · ${word}${team!==word?' '+team:''}`;
 if(tone==='goal'){const sc=side==='B'?$('#sb'):$('#sa'); if(sc){sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop')}}
 clearTimeout(el._t); el._t=setTimeout(()=>{el.hidden=true; el.className=''}, 2200)}
function render(){if(!M){$('#app').innerHTML=`<div class="msg">오늘(${TODAY()}) 경기가 아직 없어요<br><small>경기가 만들어지면 다시 열어 주세요</small></div>`;return}
 const [a,b]=score();if(!$('#sa')){$('#app').innerHTML=`<div class="top"><span>⚽ ${esc(String(M.date).slice(0,10))}</span><span id="live" class="live">⚪ 연결 중…</span></div>
 <div class="board${SW?' sw':''}" id="brd"><div class="team A"><p class="id"><i aria-hidden="true"></i>블랙</p><h2>${esc(M.A&&M.A.name||'A')}</h2><div class="sc" id="sa">0</div></div><div class="mid"><div class="colon">:</div><div class="clk" id="clk"></div></div><div class="team B"><p class="id"><i aria-hidden="true"></i>블루</p><h2>${esc(M.B&&M.B.name||'B')}</h2><div class="sc" id="sb">0</div></div><div id="fx" hidden><b></b></div></div><button id="swb" aria-label="좌우 바꾸기">⇄ 좌우 바꾸기</button>${canRec()?'<button id="recb" type="button" aria-label="기록 등록">기록</button>':''}<div id="sheet" hidden></div><div id="toast" hidden></div>`;
  $('#swb').onclick=()=>{SW=!SW;try{localStorage.setItem('achuk_board_sw',SW?'1':'')}catch(e){}$('#brd').classList.toggle('sw',SW)};
  const rb=$('#recb');if(rb)rb.onclick=()=>{SHEET=!SHEET;paintSheet()}}
 [['sa',a],['sb',b]].forEach(([id,v])=>{const el=$('#'+id);if(el.textContent!==String(v)){el.textContent=v;if(LAST){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),400)}}});LAST=[a,b];
 const ts=events().map(e=>+e.ts).filter(Boolean);KICK=+M.kick||(ts.length?Math.min(...ts):0)}
function tick(){const el=$('#clk');if(!el)return;if(!KICK||String(M.date).slice(0,10)!==TODAY()){el.textContent='';return}const s=Math.max(0,Math.floor((Date.now()-KICK)/1000));if(s>3*3600){el.textContent='';return}el.textContent=(s>=6000?'':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(tick,1000); // 화면 시계만 (데이터 폴링 아님)
function status(s){const el=$('#live');if(el)el.textContent=s==='on'?'🟢 실시간':s==='re'?'🟡 재연결 중…':'⚪ 연결 중…'}
async function live(fb){const V='10.14.1';const [A,AU,DBm]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`)]);
 F=DBm;const app=A.initializeApp(fb,'achuk-board');const au=AU.getAuth(app);d=F.getDatabase(app);
 const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('achuk-rt|'+KEY));space='s_'+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
 await AU.signInAnonymously(au);let first=true;F.onValue(F.ref(d,'.info/connected'),s=>{if(s.val()){first=false;status('on')}else status(first?'':'re')});
 const P=`achuk/${space}/live/${M.id}`;
 F.onChildAdded(F.ref(d,P+'/events'),s=>{const e=Object.assign({eid:s.key},s.val());EV[s.key]=e;render();playFx(e,false);window.__rx&&window.__rx(s.key)});
 F.onChildAdded(F.ref(d,P+'/removed'),s=>{RM[s.key]=1;render()})}
let BASE='../',FB=null;
async function load(){if(!KEY){keyForm('');return}
 try{const r=await fetch(BASE+'cfg.enc.json?_='+Date.now(),{cache:'no-store'});const c=await decryptDoc(await r.json(),KEY);STORE=c.store||'';FB=c.fb||null}
 catch(e){if(e.badKey){try{localStorage.removeItem('achuk_k')}catch(_){}KEY='';keyForm('키가 맞지 않아요');return}$('#app').innerHTML='<div class="msg">설정을 불러오지 못했어요</div>';return}
 try{if(STORE)await get()}catch(e){if(!/^pv-/.test(Q.get('m')||'')){$('#app').innerHTML='<div class="msg">서버 연결 실패 · 다시 열어 주세요</div>';return}}
 M=pick();render();if(M&&FB)live(FB).catch(e=>status(''))}
load();
</script></body></html>
