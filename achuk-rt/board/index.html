<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><script>(()=>{const B='20261104210941';const chk=()=>fetch('version.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.b&&j.b!==B&&sessionStorage.getItem('bvr')!==j.b){sessionStorage.setItem('bvr',j.b);const u=new URL(location.href);u.searchParams.set('v',j.b);location.replace(u.toString())}}).catch(()=>{});chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})})()</script><title>아축 점수판</title>
<style>*{box-sizing:border-box;margin:0}html,body{height:100%;background:#05080f;color:#e6edf3;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:2vh 4vw 9vh}
.top{display:flex;justify-content:space-between;align-items:center;font-size:2.2vh;color:#6b7891;height:3.5vh}
.board{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:3vw;min-height:0;margin:3vh 0 0}
.team{padding:3vh 2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:2vh;background:#0e1626;overflow:hidden;min-width:0}
.team h2{font-size:5.5vh;font-weight:800;line-height:1.1;margin-bottom:2vh}
.sc{font-size:min(38vh,30vw);font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.04em;transition:transform .25s}
.sc.bump{transform:scale(1.06)}
.A{border-top:1vh solid #e6edf3;order:1}.A .sc{color:#fff}
.B{border-top:1vh solid #3b82f6;order:3}.B .sc,.B h2{color:#3b82f6}
.mid{order:2;display:flex;flex-direction:column;align-items:center;justify-content:center}.colon{font-size:12vh;font-weight:800;color:#55627a}
.board.sw .A{order:3}.board.sw .B{order:1}
.clk{font-size:4.5vh;font-weight:700;color:#ffc65a;font-variant-numeric:tabular-nums}
#swb{position:fixed;left:50%;bottom:1.5vh;transform:translateX(-50%);background:#ffc65a;color:#05080f;border:0;font-size:2.6vh;font-weight:800;padding:1.1vh 2.6vh;border-radius:99px;box-shadow:0 .4vh 1.4vh rgba(0,0,0,.6);z-index:5;font-family:inherit}
#swb:active{transform:translateX(-50%) scale(.95)}
@media (orientation:portrait){.board{grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;gap:2vh;margin-top:2vh}.colon{display:none}.sc{font-size:min(22vh,45vw)}.team h2{font-size:3.6vh}.mid{min-height:4vh}#swb{left:auto;right:3vw;transform:none;bottom:auto;top:50%;margin-top:-2.6vh}#swb:active{transform:scale(.95)}}

.msg{margin:auto;text-align:center;font-size:4vh;color:#8aa}
.keyf{margin:auto;width:min(560px,90vw);background:#0e1626;padding:28px;border-radius:16px;display:flex;flex-direction:column;gap:12px;font-size:18px}
.keyf input,.keyf button{font-size:20px;padding:12px;border-radius:10px;border:1px solid #2c3d58;background:#05080f;color:#e6edf3}.keyf button{background:#1e2a3d;font-weight:700}.err{color:#ff6b6b}
</style></head><body><div id="app"><div class="msg">불러오는 중…</div></div>
<script>
// 아축 아이패드 점수판 v1 (읽기 전용). 점수 = 서버 기록 + Firebase RTDB 실시간 push (폴링 없음)
let STORE='';
// CRYPTO-BEGIN (kept self-contained so test_pages_crypto.mjs can run exactly this code in node)
// File format: {v:1, alg:'PBKDF2-SHA256/AES-256-GCM', salt, iter, iv, ct, updated}  (salt/iv/ct = base64; ct includes the GCM tag)
// Passphrase = #k=<key> from the URL fragment (fragments are never sent to the server).
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYC = {salt:null, iter:0, pass:null, key:null};
async function aesKey(pass, salt, iter){
  if(KEYC.key && KEYC.salt===salt && KEYC.iter===iter && KEYC.pass===pass) return KEYC.key; // derive once
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(salt), iterations:iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  Object.assign(KEYC, {salt, iter, pass, key}); return key;
}
async function decryptDoc(doc, pass){
  if(!doc || doc.v!==1 || !doc.salt || !doc.iv || !doc.ct || !(doc.iter>0)) throw new Error('형식 오류');
  const key = await aesKey(pass, doc.salt, doc.iter);
  let pt;
  try{ pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(doc.iv)}, key, b64d(doc.ct)); }
  catch(e){ const err=new Error('키 불일치'); err.badKey=true; throw err; }
  return JSON.parse(new TextDecoder().decode(pt));
}
// CRYPTO-END
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10),Q=new URLSearchParams(location.search);
let KEY=(new URLSearchParams(location.hash.slice(1))).get('k')||'';
try{if(KEY){localStorage.setItem('achuk_k',KEY);history.replaceState(null,'',location.pathname+location.search)}else KEY=localStorage.getItem('achuk_k')||''}catch(e){}
function keyForm(msg){$('#app').innerHTML=`<div class="keyf"><b>🔑 처음 한 번만 키를 입력해 주세요</b>${msg?`<div class="err">${msg}</div>`:''}<input id="kin" type="password" autocomplete="off" placeholder="키 또는 #k= 링크 붙여넣기"><button id="kok">저장하고 열기</button><small>이 기기에만 저장돼요</small></div>`;
 $('#kok').onclick=()=>{let v=$('#kin').value.trim();const m=v.match(/[#&]k=([^&]+)/);if(m)v=decodeURIComponent(m[1]);if(!v)return;try{localStorage.setItem('achuk_k',v)}catch(e){}KEY=v;load()}}
let DB={},M=null,EV={},RM={},F=null,d=null,space='',KICK=0;
async function get(){const r=await fetch(STORE,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:KEY,op:'get',matches:{}})});const j=await r.json();if(!j.ok)throw new Error(j.error||'server');DB=j.matches||{}}
function pick(){const q=Q.get('m');if(q&&/^pv-/.test(q))return{id:q,date:TODAY(),A:{name:'블랙'},B:{name:'블루'},goals:[]};
 if(q&&DB[q])return DB[q];const t=Q.get('d')||TODAY();return Object.values(DB).filter(x=>x&&!x.deleted&&String(x.date).slice(0,10)===t).sort((a,b)=>(+String(b.id).slice(2)||0)-(+String(a.id).slice(2)||0))[0]||null}
function events(){const s=M,rmS=s.removedEvents||{},out={};(s.goals||[]).forEach((g,i)=>{const eid=g.eid||('legacy-'+i);out[eid]=Object.assign({},g,{eid})});
 Object.values(EV).forEach(e=>{if(!out[e.eid])out[e.eid]=e});return Object.values(out).filter(e=>!RM[e.eid]&&!rmS[e.eid])}
function score(){let a=0,b=0;events().forEach(g=>{if(g.k==='골')g.t==='A'?a++:b++;else if(g.k==='자책골')g.t==='A'?b++:a++;else if(g.k==='상대골')b++});return[a,b]}
let LAST=null,SW=false;try{SW=localStorage.getItem('achuk_board_sw')==='1'}catch(e){}
function render(){if(!M){$('#app').innerHTML=`<div class="msg">오늘(${TODAY()}) 경기가 아직 없어요<br><small>경기가 만들어지면 다시 열어 주세요</small></div>`;return}
 const [a,b]=score();if(!$('#sa')){$('#app').innerHTML=`<div class="top"><span>⚽ ${esc(String(M.date).slice(0,10))}</span><span id="live" class="live">⚪ 연결 중…</span></div>
 <div class="board${SW?' sw':''}" id="brd"><div class="team A"><h2>${esc(M.A&&M.A.name||'A')}</h2><div class="sc" id="sa">0</div></div><div class="mid"><div class="colon">:</div><div class="clk" id="clk"></div></div><div class="team B"><h2>${esc(M.B&&M.B.name||'B')}</h2><div class="sc" id="sb">0</div></div></div><button id="swb" aria-label="좌우 바꾸기">⇄ 좌우 바꾸기</button>`;$('#swb').onclick=()=>{SW=!SW;try{localStorage.setItem('achuk_board_sw',SW?'1':'')}catch(e){}$('#brd').classList.toggle('sw',SW)}}
 [['sa',a],['sb',b]].forEach(([id,v])=>{const el=$('#'+id);if(el.textContent!==String(v)){el.textContent=v;if(LAST){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),400)}}});LAST=[a,b];
 const ts=events().map(e=>+e.ts).filter(Boolean);KICK=+M.kick||(ts.length?Math.min(...ts):0)}
function tick(){const el=$('#clk');if(!el)return;if(!KICK||String(M.date).slice(0,10)!==TODAY()){el.textContent='';return}const s=Math.max(0,Math.floor((Date.now()-KICK)/1000));if(s>3*3600){el.textContent='';return}el.textContent=(s>=6000?'':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(tick,1000); // 화면 시계만 (데이터 폴링 아님)
function status(s){const el=$('#live');if(el)el.textContent=s==='on'?'🟢 실시간':s==='re'?'🟡 재연결 중…':'⚪ 연결 중…'}
async function live(fb){const V='10.14.1';const [A,AU,DBm]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`)]);
 F=DBm;const app=A.initializeApp(fb,'achuk-board');const au=AU.getAuth(app);d=F.getDatabase(app);
 const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('achuk-rt|'+KEY));space='s_'+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
 await AU.signInAnonymously(au);let first=true;F.onValue(F.ref(d,'.info/connected'),s=>{if(s.val()){first=false;status('on')}else status(first?'':'re')});
 const P=`achuk/${space}/live/${M.id}`;
 F.onChildAdded(F.ref(d,P+'/events'),s=>{EV[s.key]=Object.assign({eid:s.key},s.val());render();window.__rx&&window.__rx(s.key)});
 F.onChildAdded(F.ref(d,P+'/removed'),s=>{RM[s.key]=1;render()})}
let BASE='../',FB=null;
async function load(){if(!KEY){keyForm('');return}
 try{const r=await fetch(BASE+'cfg.enc.json?_='+Date.now(),{cache:'no-store'});const c=await decryptDoc(await r.json(),KEY);STORE=c.store||'';FB=c.fb||null}
 catch(e){if(e.badKey){try{localStorage.removeItem('achuk_k')}catch(_){}KEY='';keyForm('키가 맞지 않아요');return}$('#app').innerHTML='<div class="msg">설정을 불러오지 못했어요</div>';return}
 try{if(STORE)await get()}catch(e){if(!/^pv-/.test(Q.get('m')||'')){$('#app').innerHTML='<div class="msg">서버 연결 실패 · 다시 열어 주세요</div>';return}}
 M=pick();render();if(M&&FB)live(FB).catch(e=>status(''))}
load();
</script></body></html>
