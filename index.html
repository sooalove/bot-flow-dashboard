<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>김비서 Bot Network</title>
<style>
  html,body{margin:0;height:100%;background:#070a10;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 60px rgba(0,0,0,.6)}
  /* ---- phone / Tesla layouts (DOM, real responsive; desktop canvas untouched) ---- */
  #m{display:none}
  html.dom,html.dom body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
  html.dom body{display:block}
  html.dom #c{display:none}
  html.dom #m{display:block}
  #m{--bg:#070a10;--panel:#0f1520;--border:#1d2738;--text:#e8eef7;--dim:#9aa7ba;--faint:#6f7d92;--f:15px;
    color:var(--text);font:400 var(--f)/1.4 "Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box;max-width:100%;
    padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  #m *{box-sizing:border-box}
  #m .mono{font-family:"SF Mono",SFMono-Regular,Menlo,"Noto Sans Mono CJK KR",Consolas,monospace;font-variant-numeric:tabular-nums}
  #m .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  #m .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;min-width:0}
  #m .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  #m .ch h2{margin:0;font-size:.93em;font-weight:800;letter-spacing:.06em;color:var(--dim)}
  #m .ch span{font-size:.82em;color:var(--faint);text-align:right}
  #m .hdr h1{margin:0;font-size:1.6em;font-weight:800;line-height:1.15}
  #m .hdr h1 b{color:#3fb6ff}
  #m .live{display:flex;align-items:flex-start;gap:8px;margin-top:8px;font-size:.87em;color:var(--dim);font-weight:600;overflow-wrap:anywhere}
  #m .live .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:.35em}
  #m .live .tag{font-weight:800;letter-spacing:.08em}
  #m .ctr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
  #m .ctr div{background:#0b111a;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
  #m .ctr em{display:block;font-style:normal;font-size:.82em;color:var(--faint)}
  #m .ctr b{font-size:1.3em}
  #m .warn{border-color:#ffc35c;color:#ffc35c}
  #m .warn b{display:block;font-size:1.1em;margin-bottom:4px}
  #m .warn p{margin:0;color:var(--dim)}
  /* flow stepper */
  #m .steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:2px 0 10px}
  #m .st{text-align:center;font-size:.82em;font-weight:700;color:var(--faint);padding:7px 0 6px;border-radius:8px;background:#0b111a;border:1px solid var(--border)}
  #m .st.on{color:#06101c;background:var(--c,#3fb6ff);border-color:transparent}
  #m .st.cur{color:var(--text);background:transparent;border:2px solid var(--c,#3fb6ff)}
  #m .st.stop{color:#06101c;background:#ffc35c}
  #m .now{font-size:1em;font-weight:700;overflow-wrap:anywhere}
  #m .now small{display:block;font-weight:500;font-size:.85em;color:var(--dim);margin-top:2px}
  #m .bots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #m .bots span{font-size:.82em;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
  #m .bots span.act{background:var(--c);color:#06101c}
  /* log */
  #m .log{list-style:none;margin:0;padding:0}
  #m .log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid #151d2b}
  #m .log li:first-child{border-top:0}
  #m .log .t{font-size:.82em;color:var(--faint);grid-row:span 2;padding-top:.15em}
  #m .log .b{font-weight:800;font-size:.93em}
  #m .log .s{font-size:.82em;font-weight:700;text-align:right}
  #m .log .k{grid-column:2 / 4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* merged bot card */
  #m .brow{padding:8px 0;border-top:1px solid #151d2b}
  #m .brow:first-of-type{border-top:0}
  #m .bl1{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;align-items:center;gap:10px}
  #m .bl1 b{font-weight:800}
  #m .bl1 b i{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:6px;vertical-align:.08em}
  #m .bar{height:9px;border-radius:5px;background:#1a2332;overflow:hidden}
  #m .bar span{display:block;height:100%;border-radius:5px;min-width:6px}
  #m .pct{text-align:right;color:var(--dim)}
  #m .bl2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
  #m .bl2 span{font-size:1em;white-space:nowrap}
  #m .bl2 em{display:block;font-style:normal;font-size:.8em;color:var(--faint);font-family:inherit}
  #m .run{color:#a98bff;font-weight:800}
  #m .foot{margin-top:8px;font-size:.82em;color:var(--faint);overflow-wrap:anywhere}
  /* outcomes */
  #m .oc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}
  #m .oc ul{list-style:none;margin:0;padding:0}
  #m .oc li{display:flex;align-items:center;gap:8px;padding:3px 0}
  #m .oc li i{width:10px;height:10px;border-radius:50%;flex:none}
  #m .oc li b{margin-left:auto}
  #m .donut{width:7.4em;height:7.4em;border-radius:50%;display:grid;place-items:center}
  #m .donut div{width:5.2em;height:5.2em;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;line-height:1.1}
  #m .donut b{font-size:1.6em}
  #m .donut small{display:block;font-size:.8em;color:var(--dim)}
  /* saved + tiles */
  #m .kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--dim)}
  #m .kv b{color:var(--text)}
  #m .big{font-size:2.2em;font-weight:800;color:#3fb6ff;line-height:1.1;margin-top:6px}
  #m .big.none{color:rgba(63,182,255,.55);font-size:1.6em}
  #m svg.spark{width:100%;height:56px;display:block;margin-top:6px}
  #m .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.2em,1fr));gap:8px}
  #m .tile{background:var(--panel);border:1px solid var(--border);border-left:3px solid #3fb6ff;border-radius:10px;padding:8px 10px}
  #m .tile em{display:block;font-style:normal;font-size:.82em;color:var(--dim)}
  #m .tile b{font-size:1.2em}
  #m .ftr{font-size:.82em;color:var(--faint);overflow-wrap:anywhere;margin-top:12px}
  #m .sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #m .sw button{min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:#0b111a;color:var(--dim);font:700 .87em inherit;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #m .sw button.on{border-color:#3fb6ff;color:#3fb6ff}
  @media (prefers-reduced-motion:no-preference){ html.lay-phone #m .st.cur{animation:mpulse 1.6s ease-in-out infinite} }
  @keyframes mpulse{50%{box-shadow:0 0 0 4px rgba(63,182,255,.25)}}
  /* phone landscape: two columns */
  @media (orientation:landscape) and (min-width:600px){
    html.lay-phone #m .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    html.lay-phone #m .span2{grid-column:1 / -1}
    html.lay-phone #m .hdrrow{display:flex;align-items:center;gap:1em}
    html.lay-phone #m .hdrrow .ctr{flex:1;margin:0}
  }
  /* 봇별 흐름 diagram card (phone + Tesla) */
  #m .c-dg{padding:10px 6px 10px}
  #m .c-dg .ch{padding:0 8px}
  #m .dgw{width:100%}
  #m .dgw canvas{display:block;margin:0 auto}
  #m .dgcap{padding:6px 8px 0;font-size:.87em;color:var(--dim);font-weight:600;overflow-wrap:anywhere;min-height:1.6em}
  #m .kw{margin-top:10px;border:1px solid #ffc35c;border-radius:10px;padding:8px 10px}
  /* Tesla (target: Model S/X refresh 2200x1300 panel, browser at full height x 2/3 width ≈ 940x650 CSS px).
     First screen = header + big animated diagram; 봇별 작업 비중 / 처리 결과 / 작업 로그 / 요약 follow. */
  html.lay-tesla #m{--f:clamp(15px,min(1.75vw,2.55vh),24px);--text:#f4f7fb;--dim:#b8c3d2;--faint:#8e9bb0;--border:#26324a;
    padding:calc(.5em + env(safe-area-inset-top)) .75em .7em}
  html.lay-tesla #m .grid{gap:.55em;grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-areas:"hdr hdr" "dg dg" "bots bots" "log oc" "tiles tiles"}
  html.lay-tesla #m .hdr{grid-area:hdr;padding:.5em .9em}
  html.lay-tesla #m .c-dg{grid-area:dg}
  html.lay-tesla #m .c-bots{grid-area:bots}
  html.lay-tesla #m .c-oc{grid-area:oc}
  html.lay-tesla #m .c-log{grid-area:log}
  html.lay-tesla #m .c-tiles{grid-area:tiles}
  html.lay-tesla #m .c-saved{display:none}
  html.lay-tesla #m .card{padding:.6em .85em}
  html.lay-tesla #m .c-dg{padding:.5em .3em .55em}
  html.lay-tesla #m .ch{margin-bottom:.45em}
  html.lay-tesla #m .hdrrow{display:flex;align-items:center;gap:1em}
  html.lay-tesla #m .hdr h1{font-size:1.35em;white-space:nowrap}
  html.lay-tesla #m .live{margin-top:.2em}
  html.lay-tesla #m .hdrrow .ctr{flex:1;margin:0;gap:.45em}
  html.lay-tesla #m .ctr div{padding:.3em .6em}
  html.lay-tesla #m .ctr b{font-size:1.25em}
  html.lay-tesla #m .brow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:1.2em;align-items:center;padding:.35em 0}
  html.lay-tesla #m .bl2{margin-top:0}
  html.lay-tesla #m .bl2 span{font-size:1.05em}
  html.lay-tesla #m .log li{grid-template-columns:auto auto minmax(0,1fr) auto;align-items:baseline;padding:.32em 0}
  html.lay-tesla #m .log .t{grid-row:auto;padding:0}
  html.lay-tesla #m .log .k{grid-column:auto;grid-row:1;grid-column-start:3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset}
  html.lay-tesla #m .log .s{grid-column-start:4;grid-row:1}
  html.lay-tesla #m .log li:nth-child(n+6){display:none}
  html.lay-tesla #m .c-tiles .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
  html.lay-tesla #m .ftrrow{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-top:.5em}
  html.lay-tesla #m .ftrrow .ftr{margin:0}
  html.lay-tesla #m .ftrrow .sw{margin:0;flex:none}
  html.lay-tesla #m .sw button{min-height:56px;min-width:5.2em;font-size:.9em}
  /* Tesla browser at full width (~1410x640 CSS): diagram left, 봇별 작업 비중 right on the first screen */
  @media (min-width:1200px){
    html.lay-tesla #m .grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-areas:"hdr hdr" "dg bots" "log oc" "tiles tiles"}
    html.lay-tesla #m .brow{display:block}
    html.lay-tesla #m .bl2{margin-top:.3em}
    html.lay-tesla #m .c-dg{display:flex;flex-direction:column;justify-content:center}
  }
  html.lay-phone #m .t-saved{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="m" aria-live="polite"></div>
<script>
(() => {
const W = 1080, H = 1350;
const cv = document.getElementById('c');
const ctx0 = cv.getContext('2d'); let ctx = ctx0;
const SANS = '"Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const MONO = '"Noto Sans Mono CJK KR","D2Coding","SFMono-Regular",Menlo,Consolas,monospace';
const C = {
  bg:'#0a0e16', panel:'#0f1520', border:'#1d2738', text:'#e8eef7', dim:'#8592a6', faint:'#4a5568',
  cyan:'#3fb6ff', green:'#3ddc97', purple:'#a98bff', pink:'#ff6b9a', amber:'#ffc35c', grey:'#6b7a90', red:'#ff5340', yellow:'#fee500' // yellow = Kakao brand yellow (카카오봇)
};
const BOTS = [
  {id:'coupang',  name:'쿠팡봇',     sub:'쿠팡 장보기·가격 비교', color:C.pink,   x:100},
  {id:'naver',    name:'네이버봇',   sub:'네이버 예약·지도·쇼핑', color:C.green,  x:276},
  {id:'interpark',name:'인터파크봇', sub:'티켓·공연·여행',        color:C.purple, x:452},
  {id:'calendar', name:'개인비서봇',   sub:'구글 캘린더 일정',      color:C.cyan,   x:628},
  {id:'tesla',    name:'테슬라봇',   sub:'차량 명령·목적지',    color:C.red,    x:804},
  {id:'kakao',    name:'카카오봇',   sub:'대기 (연결 전)', desc:'카카오톡 메시지 전송', color:C.yellow, x:980, state:'대기 (연결 전)', pending:true}, // Kakao API key/OAuth not connected yet → dashed node, no demo traffic
];
const BOTW=166; // specialist node width in wide/compact geometry (6 nodes, 176px apart)
const TOP=250, MID=452, BOT=660;
// Diagram geometry. 'wide' = the original 1080px desktop scene (unchanged); 'compact' = shorter landscape
// version (phone landscape, Tesla); 'tall' = portrait re-flow for phones. Same node ids/edge keys in all.
const N = {}, E = {};
const GF0={label:19,sub:12.5,dia:17,q:14,hub:18,stop:17,tag:13};
let GF=GF0, GEOM='wide';
const GEO={wide:{w:1080,y0:150,y1:770,tag:{hub:92,dia:68,bot:56,box:-58}},
  compact:{w:1080,y0:0,y1:440,tag:{hub:84,dia:66,bot:52,box:-58}},
  tall:{w:400,y0:0,y1:722,tag:{hub:72,dia:54,bot:34,box:-44}}};
function edge(a,b,c1,c2){
  const A=N[a],B=N[b];
  const p0=[A.x,A.y], p3=[B.x,B.y];
  c1=c1||[A.x+(B.x-A.x)/3, A.y+(B.y-A.y)/3];
  c2=c2||[A.x+(B.x-A.x)*2/3, A.y+(B.y-A.y)*2/3];
  const pts=[], len=[0]; const S=80;
  for(let i=0;i<=S;i++){const u=i/S,v=1-u;
    pts.push([v*v*v*p0[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*p3[0], v*v*v*p0[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*p3[1]]);
    if(i) len.push(len[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));}
  E[a+'>'+b]={a,b,p0,c1,c2,p3,pts,len,L:len[S]};
}
function buildGeom(name){
  for(const k in N) delete N[k]; for(const k in E) delete E[k];
  GEOM=name;
  if(name==='tall'){
    GF={label:17,sub:14.5,dia:16,q:14.5,hub:16,stop:14.5,tag:14.5};
    Object.assign(N,{
      req:{x:82,y:58,w:132,h:62,type:'box',label:'요청',sub:'사용자'},
      hub:{x:295,y:72,w:112,h:112,type:'hub',label:'김비서'},
      sel:{x:200,y:212,w:156,h:78,type:'dia',label:'봇 선택',q:'어떤 봇?'},
      appr:{x:200,y:488,w:156,h:78,type:'dia',label:'승인',q:'예약·결제인가?'},
      exec:{x:300,y:592,w:172,h:62,type:'box',label:'실행',sub:'봇이 작업 수행'},
      chk:{x:300,y:680,w:172,h:62,type:'box',label:'확인',sub:'결과 재검증'},
      rep:{x:100,y:680,w:172,h:62,type:'box',label:'보고',sub:'사용자에게 전달'},
      stop:{x:100,y:592,w:184,h:62,type:'stop',label:'멈춤: 사용자에게 질문',sub:'정보가 부족할 때'}});
    const BP={coupang:[78,312],naver:[200,312],interpark:[322,312],calendar:[78,384],tesla:[200,384],kakao:[322,384]};
    BOTS.forEach(b => N[b.id] = {x:BP[b.id][0],y:BP[b.id][1],w:114,h:58,type:'bot',label:b.name,sub:b.pending?b.state:'',color:b.color,pending:b.pending});
    edge('req','hub'); edge('hub','sel',[295,160],[200,150]);
    BOTS.forEach(b=>{ const n=N[b.id]; edge('sel',b.id,[200,262],[n.x,n.y-60]); edge(b.id,'appr',[n.x,n.y+60],[200,420]); });
    edge('appr','exec',[200,545],[300,540]); edge('appr','stop',[200,545],[100,540]);
    edge('exec','chk'); edge('chk','rep');
    edge('rep','req',[6,640],[6,120]);
    edge('hub','rep',[396,250],[20,600]);
    edge('sel','appr',[200,330],[200,420]);
  } else if(name==='compact'){
    GF={label:24,sub:18,dia:22,q:18,hub:22,stop:20,tag:18};
    const T0=58, M0=218, B0=376;
    Object.assign(N,{
      req:{x:98,y:M0,w:160,h:80,type:'box',label:'요청',sub:'사용자'},
      hub:{x:335,y:M0,w:132,h:132,type:'hub',label:'김비서'},
      sel:{x:600,y:M0,w:176,h:94,type:'dia',label:'봇 선택',q:'어떤 봇?'},
      appr:{x:880,y:M0,w:176,h:94,type:'dia',label:'승인',q:'예약·결제인가?'},
      exec:{x:675,y:B0,w:200,h:76,type:'box',label:'실행',sub:'봇이 작업 수행'},
      chk:{x:410,y:B0,w:200,h:76,type:'box',label:'확인',sub:'결과 재검증'},
      rep:{x:160,y:B0,w:200,h:76,type:'box',label:'보고',sub:'사용자에게 전달'},
      stop:{x:930,y:B0,w:260,h:76,type:'stop',label:'멈춤: 사용자에게 질문',sub:'정보가 부족할 때'}});
    BOTS.forEach(b => N[b.id] = {x:b.x,y:T0,w:BOTW,h:80,type:'bot',label:b.name,sub:b.sub,color:b.color,pending:b.pending});
    edge('req','hub'); edge('hub','sel');
    BOTS.forEach(b=>{ edge('sel',b.id,[600,140],[b.x,135]); edge(b.id,'appr',[b.x,135],[860,125]); });
    edge('appr','exec',[880,305],[690,300]); edge('appr','stop',[880,300],[930,300]);
    edge('exec','chk'); edge('chk','rep');
    edge('rep','req',[40,376],[80,300]);
    edge('hub','rep',[335,320],[240,376]);
    edge('sel','appr',[690,M0],[790,M0]);
  } else {
    GF=GF0; GEOM='wide';
    Object.assign(N,{
      req:{x:105,y:MID,w:150,h:70,type:'box',label:'요청',sub:'사용자'},
      hub:{x:345,y:MID,w:150,h:150,type:'hub',label:'김비서'},
      sel:{x:600,y:MID,w:156,h:86,type:'dia',label:'봇 선택',q:'어떤 봇?'},
      appr:{x:880,y:MID,w:156,h:86,type:'dia',label:'승인',q:'예약·결제인가?'},
      exec:{x:675,y:BOT,w:180,h:66,type:'box',label:'실행',sub:'봇이 작업 수행'},
      chk:{x:405,y:BOT,w:180,h:66,type:'box',label:'확인',sub:'결과 재검증'},
      rep:{x:165,y:BOT,w:180,h:66,type:'box',label:'보고',sub:'사용자에게 전달'},
      stop:{x:915,y:BOT,w:220,h:66,type:'stop',label:'멈춤: 사용자에게 질문',sub:'정보가 부족할 때'}});
    BOTS.forEach(b => N[b.id] = {x:b.x,y:TOP,w:BOTW,h:70,type:'bot',label:b.name,sub:b.sub,color:b.color,pending:b.pending});
    edge('req','hub'); edge('hub','sel');

  v.tiles=[['기록 시작',tasks.length?kst(tasks.reduce((a,t)=>Math.min(a,t.first),Infinity),true).slice(0,5):'—'],
    ['평균 처리',fin.length?avgMin.toFixed(1)+'분':'—'],['사용 봇',String(botsUsed.size)],
    ['멈춤 비율',fin.length?(v.oc.halted/ftot*100).toFixed(1)+'%':'—'],['승인 비율',fin.length?(v.oc.approval/ftot*100).toFixed(1)+'%':'—']];
  v.latest=[...tasks].sort((a,b)=>b.last-a.last)[0]||null;
  return v;
}
const MS={parts:{}};
function setPart(id,cls,html){
  let el=document.getElementById('m-'+id);
  if(!el){ el=document.createElement('div'); el.id='m-'+id; el.className=cls; (MS.host||M).appendChild(el); }
  if(MS.parts[id]!==html){ MS.parts[id]=html; el.innerHTML=html; }
  return el;
}
function liveLine(){
  const pages=('keyErr' in L);
  const la=L.events.length?tsMs(L.events[L.events.length-1]):(L.upd||0);
  const stale=L.loaded && la>0 && Date.now()-la>10*60e3;
  const laTxt=la?kst(la, kst(la,true).slice(0,5)!==kst(Date.now(),true).slice(0,5)):'';
  const hb=L.lastFetch?`마지막 확인 ${kst(L.lastFetch,false,true)}`:'연결 중';
  const state = L.keyErr ? (L.keyErr==='nocrypto'?'https 연결이 필요해요':'링크에 키가 없거나 틀렸어요')
    : !L.loaded ? (L.ok?'기록 불러오는 중…':`연결 끊김 · 재시도 중 (${L.err})`)
    : !L.ok ? `연결 끊김 · 재시도 중 (${L.err})`
    : stale ? `봇들 대기 중 · 마지막 활동 ${laTxt} (KST)`
    : L.events.length ? '새 기록 대기 중' : '아직 기록이 없어요 · 대기 중';
  const col=(L.keyErr||!L.ok)?C.amber:stale?C.cyan:C.green;
  return {txt:`${hb} · ${state}`,col,pages};
}
function renderDom(){
  if(!M) return;
  if(!MS.host){ MS.host=null; }
  // skeleton
  if(!document.getElementById('m-grid')){ M.innerHTML='<div class="grid" id="m-grid"></div><div class="ftrrow" id="m-ftrrow"></div>'; MS.parts={}; }
  const g=document.getElementById('m-grid'), fr=document.getElementById('m-ftrrow');
  const v=computeView(), ll=liveLine(), tesla=CUR==='tesla';
  MS.host=g;
  let keyHtml='';
  if(L.keyErr){
    const msg=L.keyErr==='nocrypto'?'이 브라우저에서는 열 수 없어요 (https 필요)':'링크에 키가 없거나 틀렸어요';
    const sub=L.keyErr==='nocrypto'?'https:// 주소로 다시 열어 주세요':'받은 링크 전체(#k=… 부분 포함)를 그대로 열어 주세요';
    keyHtml=`<div class="warn kw"><b>${msg}</b><p>${sub}</p></div>`; }
  // header
  setPart('hdr','card hdr span2',
    `<div class="hdrrow"><div><h1><b>김비서</b> Bot Network</h1>
     <div class="live"><span class="dot" style="background:${ll.col}"></span><span><span class="tag mono" style="color:${ll.col}">LIVE</span> · ${esc(ll.txt)}</span></div></div>
     <div class="ctr">${v.ctr.map(c=>`<div><em>${c[0]}</em><b class="mono">${fmt(c[1])}</b></div>`).join('')}</div></div>${keyHtml}`);
  // 봇별 흐름 diagram (animated canvas, created once per layout; caption updated by renderDiagram)
  if(!document.getElementById('m-dg')){ const d=document.createElement('div'); d.id='m-dg'; d.className='card c-dg span2';
    d.innerHTML='<div class="ch"><h2>봇별 흐름</h2><span>요청 → 김비서 → 봇 → 승인 → 실행 · 확인 · 보고</span></div><div class="dgw"><canvas id="m-dgc" role="img" aria-label="김비서 봇 네트워크 흐름도"></canvas></div><div class="dgcap" id="m-dgcap"></div>';
    g.appendChild(d); DG.cv=null; DG.cap=''; }
  // merged 봇별 작업 비중
  const tot=v.tasks.length; let rows=v.bw; const MAXR=tesla?5:6;
  if(rows.length>MAXR){ const o={bot:`기타 ${rows.length-MAXR+1}개`,other:true,n:0,today:0,fin:0,run:0,sec:0};
    for(const b of rows.slice(MAXR-1)) for(const k of ['n','today','fin','run','sec']) o[k]+=b[k]; rows=[...rows.slice(0,MAXR-1),o]; }
  const tf=v.bw.reduce((a,b)=>a+b.fin,0), tsum=v.bw.reduce((a,b)=>a+b.sec,0);
  setPart('bots','card c-bots',`<div class="ch"><h2>봇별 작업 비중</h2><span>작업 수 기준 · 많은 순</span></div>`+
    (!tot?'<div class="now">아직 기록이 없어요</div>':rows.map(b=>{ const col=b.other?C.grey:BOTCOL(b.bot), sh=b.n/tot;
      return `<div class="brow"><div class="bl1"><b><i style="background:${col}"></i>${esc(b.bot)}</b><div class="bar"><span style="width:${(sh*100).toFixed(1)}%;background:${col}"></span></div><span class="pct mono">${(sh*100).toFixed(0)}%</span></div>
      <div class="bl2"><span class="mono"><em>오늘/전체</em>${fmt(b.today)}/${fmt(b.n)}</span><span class="mono"><em>총 시간</em>${b.fin?fmtDurM(b.sec):'—'}</span><span class="mono"><em>평균</em>${b.fin?fmtDurM(b.sec/b.fin):'—'}</span><span class="mono ${b.run?'run':''}"><em>미완료</em>${fmt(b.run)}</span></div></div>`; }).join(''))+
    `<div class="foot">전체 ${fmt(tot)}건 · 완료 ${fmt(tf)}건 합계 ${fmtDurM(tsum)} · 시간 = 첫 기록→보고${v.idleBots.length?` · 기록 없음: ${v.idleBots.join('·')}`:''}</div>`);
  // 작업 로그
  setPart('log','card c-log',`<div class="ch"><h2>작업 로그</h2><span>최근 ${tesla?5:6}건 · KST</span></div>`+
    (!v.recent.length?'<div class="now">아직 기록이 없어요<small>botlog.py로 기록하면 여기에 바로 나타나요</small></div>':
    `<ul class="log">${v.recent.map(r=>`<li><span class="t mono">${kst(r.t.last,true)}</span><span class="b" style="color:${BOTCOL(r.t.bot)}">${esc(r.t.bot)}</span><span class="s" style="color:${r.st[1]}">${esc(r.st[0])}</span><span class="k">${esc(r.label||'')}</span></li>`).join('')}</ul>`));
  // 처리 결과
  const OUT=[['auto','자동 처리',C.green],['approval','승인 후 처리',C.text],['halted','질문 후 멈춤',C.amber],['skipped','건너뜀',C.grey],['running','진행 중',C.purple]];
  let acc=0; const segs=tot?OUT.filter(o=>v.oc[o[0]]>0).map(o=>{ const a=acc/tot*360; acc+=v.oc[o[0]]; return `${o[2]} ${a.toFixed(2)}deg ${(acc/tot*360).toFixed(2)}deg`; }).join(','):'';
  setPart('oc','card c-oc',`<div class="ch"><h2>처리 결과</h2><span>전체 기록</span></div><div class="oc"><ul>${OUT.map(o=>`<li><i style="background:${o[2]}"></i>${o[1]}<b class="mono" style="color:${o[2]}">${fmt(v.oc[o[0]])}</b></li>`).join('')}</ul>
    <div class="donut" style="background:${tot?`conic-gradient(${segs})`:'#1a2332'}"><div><span><b class="mono">${fmt(tot)}</b><small>${tot?'작업':'기록 없음'}</small></span></div></div></div>`);
  // 아낀 시간 (phone) — Tesla shows it as a tile instead
  let spark=''; if(v.savedSum>0){ const vals=v.savedVals.length<3?[0,...v.savedVals]:v.savedVals, mx=Math.max(...vals)||1;
    spark=`<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><polyline fill="none" stroke="${C.cyan}" stroke-width="2" vector-effect="non-scaling-stroke" points="${vals.map((x,i)=>`${(i/(vals.length-1)*100).toFixed(2)},${(38-x/mx*34).toFixed(2)}`).join(' ')}"/></svg>`; }
  setPart('saved','card c-saved',`<div class="ch"><h2>아낀 시간</h2><span>누적 · 분</span></div>
    <div class="kv">기록된 작업<b class="mono">${fmt(tot)}건</b></div><div class="kv">시간 기록 있는 작업<b class="mono">${fmt(v.savedTasks.length)}건</b></div>
    ${spark}<div class="big ${v.savedSum>0?'':'none'}">${v.savedSum>0?fmt(v.savedSum)+'분':'기록 없음'}</div><div class="foot">minutes_saved 합계</div>`);
  // tiles
  const tl=[...v.tiles]; const savedTile=['아낀 시간',v.savedSum>0?fmt(v.savedSum)+'분':'—','t-saved'];
  setPart('tiles','card c-tiles wide',`<div class="ch"><h2>요약</h2><span>전체 기록</span></div><div class="tiles">${[savedTile,...tl].map(x=>`<div class="tile ${x[2]||''}"><em>${x[0]}</em><b class="mono">${esc(x[1])}</b></div>`).join('')}</div>`);
  // footer (wraps) + layout switch
  const upd=L.lastFetch?`업데이트 ${kst(L.lastFetch,false,true)} KST`:'불러오는 중';
  const pub=L.upd?` • 게시 ${kst(L.upd,true)} KST`:'';
  const ftxt=(ll.pages?`실제 기록(암호화) • ${upd}${pub}`:`실제 기록 • events.jsonl 기준 • ${upd}`)+(L.ok?'':' • 연결 끊김')+' • 김비서 · 쿠팡봇 · 네이버봇 · 인터파크봇 · 개인비서봇 · 테슬라봇 · 카카오봇';
  const swh=`<div class="sw">${[['phone','아이폰'],['tesla','테슬라'],['desktop','데스크톱']].map(o=>`<button type="button" data-lay="${o[0]}" class="${CUR===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
  const fh=`<div class="ftr">${esc(ftxt)}</div>${swh}`;
  if(MS.parts.ftr!==fh){ MS.parts.ftr=fh; fr.innerHTML=fh; }
}
// layout switch buttons: change ?layout= in place, keep #k=… (key fragment) untouched, no reload
document.addEventListener('click',e=>{ const b=e.target&&e.target.closest&&e.target.closest('#m button[data-lay]'); if(!b) return;
  const u=new URL(location.href); u.searchParams.set('layout',b.dataset.lay); history.replaceState(null,'',u.pathname+u.search+location.hash); applyLayout(); if(CUR!=='desktop'){ renderDom(); DG.dom=performance.now()/1000; } });
addEventListener('resize',()=>{ applyLayout(); });
addEventListener('orientationchange',()=>{ applyLayout(); });
window.__view=()=>{ const v=computeView(); return {bw:v.bw, oc:v.oc, tiles:v.tiles, ctr:v.ctr}; };

// ---------- sizing & loop ----------
let scale=1;
function resize(){
  const s=Math.min(innerWidth/W, innerHeight/H);
  const dpr=window.devicePixelRatio||1;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr); cv.height=Math.round(H*s*dpr); scale=s*dpr;
}
addEventListener('resize',resize); resize();
const manual = /[?&]manual/.test(location.search);
// live when served over http(s) unless ?mock; file:// (record.py) and ?manual stay mock
const LIVE = /^https?:/.test(location.protocol) && !/[?&]mock/.test(location.search) && !manual;
function LIVE_MODE(){ return LIVE; }
window.__mode = LIVE ? 'live' : 'mock';
window.__render = t => renderMock(t);
window.__live = L;
if(LIVE){ document.title='김비서 Bot Network · LIVE'; L.lastReal=nowS()-REPLAY_IDLE+3; /* first replay ~3s after load */ poll(); applyLayout(); (function loop(){ const T=performance.now()/1000;
    if(CUR==='desktop') renderLive(T);
    else { try{ if(T-DG.dom>=(CUR==='tesla'?1.5:1)){ renderDom(); DG.dom=T; } if(T-DG.last>=(CUR==='tesla'?0.03:0)){ renderDiagram(T); DG.last=T; } }catch(e){ console.error(e); } }
    requestAnimationFrame(loop); })(); }
else if(!manual){ const t0=performance.now(); (function loop(){ renderMock((performance.now()-t0)/1000); requestAnimationFrame(loop); })(); }
})();
