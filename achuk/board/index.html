/* Peloton — "red beacon on charcoal runway" (live-streamed classes): Carbon Black #181a1d stage, white plates, one red ON-AIR accent.

 <div class="board${SW?' sw':''}" id="brd"><section class="team A" aria-label="블랙 팀"><div class="flash"></div><div class="id"><span class="tag">BLACK</span><h2>${esc(M.A&&M.A.name||'A')}</h2></div><div class="scw"><div class="sc" id="sa">0</div></div></section><div class="mid"><div class="colon">:</div></div><section class="team B" aria-label="블루 팀"><div class="flash"></div><div class="id"><span class="tag">BLUE</span><h2>${esc(M.B&&M.B.name||'B')}</h2></div><div class="scw"><div class="sc" id="sb">0</div></div></section></div><button id="swb" aria-label="좌우 바꾸기">⇄ 좌우 바꾸기</button><button id="sndb" type="button" aria-label="득점 소리 켜기/끄기">🔊</button><button id="crwb" type="button" aria-label="관중 응원 배경 소리 켜기/끄기" aria-pressed="false">📣 관중</button>${canRec()?'<button id="recb" type="button" aria-label="기록 등록">기록</button>':''}<div id="fx" aria-live="polite"></div><div id="sheet" hidden></div><div id="toast" hidden></div>`;
  $('#swb').onclick=()=>{SW=!SW;try{localStorage.setItem('achuk_board_sw',SW?'1':'')}catch(e){}const br=$('#brd');br.classList.toggle('sw',SW);br.classList.remove('swapping');void br.offsetWidth;br.classList.add('swapping');setTimeout(()=>br.classList.remove('swapping'),500)};
  $('#sndb').onclick=()=>{SND=!SND;try{localStorage.setItem('achuk_board_snd',SND?'1':'0')}catch(e){}paintSnd();if(SND)sfxUnlock()};paintSnd();$('#crwb').onclick=()=>{CRW=!CRW;try{localStorage.setItem('achuk_board_crowd',CRW?'1':'0')}catch(e){}paintCrowd();sfxUnlock();crowdSync()};paintCrowd();
  const rb=$('#recb');if(rb)rb.onclick=()=>{SHEET=!SHEET;paintSheet()}}
 const evs=events();const fresh=[];evs.forEach(e=>{if(!SEEN[e.eid]){SEEN[e.eid]=1;if(BOOTED&&!(+e.ts&&+e.ts<BOOT_AT-15000))fresh.push(e)}});
 [['sa',a],['sb',b]].forEach(([id,v],i)=>{const el=$('#'+id);if(el.textContent!==String(v)){const up=LAST&&v>LAST[i];el.textContent=v;if(LAST){el.classList.remove('slam','drop');void el.offsetWidth;el.classList.add(up?'slam':'drop');setTimeout(()=>el.classList.remove('slam','drop'),750)}}});LAST=[a,b];
 if(fresh.length){const pri=fresh.filter(e=>e.k==='골'||e.k==='자책골'||e.k==='상대골');celebrate((pri.length?pri:fresh)[ (pri.length?pri:fresh).length-1 ])}
 BOOTED=true;
 const ts=evs.map(e=>+e.ts).filter(Boolean);KICK=+M.kick||(ts.length?Math.min(...ts):0);tick()}
function tick(){const el=$('#clk'),w=$('#clkw');if(!el||!M)return;const show=v=>{if(w)w.hidden=!v};if(!KICK||String(M.date).slice(0,10)!==TODAY()){el.textContent='';show(false);return}const s=Math.max(0,Math.floor((Date.now()-KICK)/1000));if(s>3*3600){el.textContent='';show(false);return}el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');show(true)}
setInterval(tick,1000); // 화면 시계만 (데이터 폴링 아님)
function status(s){const el=$('#live');if(el)el.textContent=s==='on'?'🟢 실시간':s==='re'?'🟡 재연결 중…':'⚪ 연결 중…'}
async function live(fb){const V='10.14.1';const [A,AU,DBm]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`)]);
 F=DBm;const app=A.initializeApp(fb,'achuk-board');const au=AU.getAuth(app);d=F.getDatabase(app);
 const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('achuk-rt|'+KEY));space='s_'+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
 await AU.signInAnonymously(au);let first=true;F.onValue(F.ref(d,'.info/connected'),s=>{if(s.val()){first=false;status('on')}else status(first?'':'re')});
 const P=`achuk/${space}/live/${M.id}`;
 F.onChildAdded(F.ref(d,P+'/events'),s=>{EV[s.key]=Object.assign({eid:s.key},s.val());render();window.__rx&&window.__rx(s.key)});
 F.onChildAdded(F.ref(d,P+'/removed'),s=>{RM[s.key]=1;render()})}
let BASE='../',FB=null;
async function load(){if(!KEY){keyForm('');return}
 try{const r=await fetch(BASE+'cfg.enc.json?_='+Date.now(),{cache:'no-store'});const c=await decryptDoc(await r.json(),KEY);STORE=c.store||'';FB=c.fb||null}
 catch(e){if(e.badKey){try{localStorage.removeItem('achuk_k')}catch(_){}KEY='';keyForm('키가 맞지 않아요');return}$('#app').innerHTML='<div class="msg">설정을 불러오지 못했어요</div>';return}
 try{if(STORE)await get()}catch(e){if(!/^pv-/.test(Q.get('m')||'')){$('#app').innerHTML='<div class="msg">서버 연결 실패 · 다시 열어 주세요</div>';return}}
 M=pick();render();if(M&&FB)live(FB).catch(e=>status(''))}
// BOOT-BEGIN
load();
// BOOT-END

</script></body></html>
