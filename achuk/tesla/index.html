 async function key(id){if(myK[id])return myK[id];let s;try{s=localStorage.getItem('achuk_vs_'+id)}catch(e){}if(!s){s=b64(crypto.getRandomValues(new Uint8Array(24)));try{localStorage.setItem('achuk_vs_'+id,s)}catch(e){}}
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+'|'+id));return myK[id]=b64(new Uint8Array(h)).slice(0,14)}
 const path=id=>`achuk/${sp}/live/vv_${id}/removed`;
 const R=m=>[...m.A.players,...m.B.players].filter(isReal).sort((a,b)=>a.localeCompare(b,'ko'));
 function watch(id){if(on[id])return;on[id]=1;key(id).then(()=>{if(TAB==='in'&&D&&D.id===id)renderVote()});init().then(()=>F.onValue(F.ref(d,path(id)),s=>{const v=s.val()||{};data[id]=Object.keys(v).filter(k=>typeof v[k]==='number').map(k=>({vk:k.slice(0,14),i:parseInt(k.slice(14,16),36),ts:v[k]}));if(TAB==='in'&&D&&D.id===id)renderVote()})).catch(()=>{on[id]=0})}
 async function cast(m,p){await init();const i=R(m).indexOf(p);if(i<0)throw new Error('player');const k=(await key(m.id))+i.toString(36).padStart(2,'0')+b64(crypto.getRandomValues(new Uint8Array(3)));
  await F.set(F.ref(d,path(m.id)+'/'+k),F.serverTimestamp())}
 return{watch,cast,get:(id,m)=>(data[id]||[]).map(v=>({ts:v.ts,uid:v.vk,p:R(m)[v.i]})),me:id=>myK[id]||''}})();
function aomState(m){const id=m.id,ev=(typeof LIVE!=='undefined'?LIVE.events(id):[]),roster=[...m.A.players,...m.B.players].filter(isReal);
 let kick=+m.kick||0;if(!kick&&DB[id]&&DB[id].kick)kick=+DB[id].kick;if(!kick){try{localStorage.removeItem('achuk_kick_'+id)}catch(e){}}else{try{kick=kick||+localStorage.getItem('achuk_kick_'+id)||0}catch(e){}}
 const first=ev.map(e=>+e.ts).filter(Boolean).sort((a,b)=>a-b)[0],made=+(String(id).match(/^m-(\d{13})$/)||[])[1]||0;
 const anchor=kick||first||made||0,anchorBy=kick?'킥오프':first?'첫 기록':made?'경기 생성':'';
 const endAt=m.end?+m.end:(kick?kick+2*36e5:0),deadline=endAt?endAt+30*6e4:0;
 const vs=VT.get(id,m).filter(v=>v.p).slice().sort((a,b)=>a.ts-b.ts),last={},firstHit={};let closedAt=0,why='';
 for(const v of vs){if(deadline&&v.ts>deadline)break;if(!roster.includes(v.p))continue;last[v.uid]=v.p;if(Object.keys(last).length>=roster.length){closedAt=v.ts;why='전원 투표';break}}
 const now=Date.now(),past=String(m.date).slice(0,10)<TODAY();if(!closedAt&&deadline&&now>deadline){closedAt=deadline;why='종료 후 30분'}
 const tally={};Object.values(last).forEach(p=>tally[p]=(tally[p]||0)+1);
 const pts=p=>ev.filter(e=>e.p===p).reduce((s,e)=>s+(AOMW[e.k]||0),0);
 const mx=Math.max(0,...Object.values(tally)),top=Object.keys(tally).filter(p=>tally[p]===mx&&mx>0);
 let win='',tb='';if(top.length===1)win=top[0];else if(top.length>1){top.sort((a,b)=>pts(b)-pts(a)||a.localeCompare(b,'ko'));win=top[0];tb=`동률 ${top.length}명 → 공격·수비 포인트 ${top.map(p=>p+' '+pts(p)).join(' / ')}${pts(top[0])===pts(top[1])?' → 동점이라 이름순':''}`}
 return{roster,anchor,anchorBy,endAt,deadline,closed:!!closedAt||past,closedAt,why:why||(past?'지난 경기':''),tally,voters:Object.keys(last).length,mine:last[VT.me(id)]||'',win,tb,hasNew:vs.length>0}}
const hm=t=>new Date(t+9*36e5).toISOString().slice(11,16);
let AOMPUT={};
function renderVote(){const el=document.getElementById('vote');if(!el||!D||!D.confirmed)return;const m=D;VT.watch(m.id);const S=aomState(m),ro=typeof isRO==='function'&&isRO();
 const legacy=!S.hasNew&&(DB[m.id]||{}).votes;const closed=S.closed||ro;
 const rule='익명 · 투표자 추적 불가 · 한 사람 1표 · AOM 선정 전까지 변경 가능 · 전원 투표 또는 경기 종료(킥오프+2시간) 후 30분 마감';
 const left=S.deadline?Math.max(0,S.deadline-Date.now()):0;
 const tline=closed?(S.closedAt?`마감 ${hm(S.closedAt)} (${S.why})`:'마감'):S.deadline?`⏳ ${hm(S.deadline)} 마감 · 남은 시간 ${Math.floor(left/36e5)}:${String(Math.floor(left%36e5/6e4)).padStart(2,'0')} (종료 ${S.endAt?hm(S.endAt):'-'} 후 30분) · 투표 ${S.voters}/${S.roster.length}명`:`투표 ${S.voters}/${S.roster.length}명 · 킥오프 후 2시간 종료 · 종료 30분 뒤 AOM 마감`;
 let res;if(legacy){const top=String(DB[m.id].aom||'').split('·').filter(Boolean);res=top.length?'🏆 AOM: '+top.map(esc).join(', ')+' <span class="sub">(이전 방식 집계)</span>':'투표 없음'}
 else if(S.win)res=(closed?'🏆 AOM: ':'현재 1위: ')+esc(S.win)+` (${S.tally[S.win]}표)`+(S.tb?`<div class="sub">${esc(S.tb)}</div>`:'');
 else res=closed?(m.aom?'🏆 AOM: '+esc(String(m.aom).split('·').join(', ')):'투표 없이 마감'):'아직 투표 없음';
 const T=legacy?Object.assign({},DB[m.id].votes):S.tally;
 el.innerHTML=`<h3>③ AOM 익명 투표 ${closed?'<span class="tag" style="background:#ffb020">마감</span>':''}</h3><div class="step">${rule}</div><div class="sub" style="margin:2px 0 8px">${tline}</div>
  ${S.roster.map(p=>`<button class="chip ${S.mine===p?'on':''}" data-v2="${esc(p)}" ${closed||legacy?'disabled':''}>${esc(p)}${T[p]?' '+T[p]+'표':''}${S.mine===p?' ✓':''}</button>`).join('')}
  <div style="margin-top:8px;font-weight:700;color:#39ff88">${res}</div>${!closed&&S.mine?`<div class="sub">내 투표: ${esc(S.mine)} · 다른 선수를 누르면 변경돼요</div>`:''}`;
 el.querySelectorAll('[data-v2]').forEach(b=>b.onclick=async()=>{const p=b.dataset.v2;if(p===S.mine)return;const S2=aomState(D);if(S2.closed)return toast('AOM 투표가 마감됐어요');try{await VT.cast(D,p);toast(S.mine?'투표를 '+p+'(으)로 바꿨어요':'투표 완료')}catch(e){toast('투표 실패: '+(e.code||e.message))}});
 if(closed&&S.win&&!legacy&&!String(m.id).startsWith('pv-')&&DB[m.id]&&!DB[m.id].votes&&DB[m.id].aom!==S.win&&!AOMPUT[m.id]){AOMPUT[m.id]=1;const c=JSON.parse(JSON.stringify(DB[m.id]));c.aom=S.win;put(c).then(ok=>{if(ok){DB[m.id].aom=S.win}})}}
{const _r=renderIn;renderIn=function(S){_r(S);try{renderVote()}catch(e){console.error(e)}}}
setInterval(()=>{if(TAB==='in'&&document.getElementById('vote')&&!BUSY)renderVote()},30000);

// ===== 익명 후기 → 선수 언급 (주관적 의견 · 참고용, 낮은 비중) =====
function peerMentions(p){if(!p||p.length<2)return[];const names=Object.keys(stats()).filter(n=>n!==p&&n.includes(p));const out=[];
 list().forEach(m=>{if(![...m.A.players,...m.B.players].includes(p))return;(m.reviews_anon||[]).forEach(r=>{const t=String(r.text||'');
  const sents=t.split(/(?<=[.!?。\n])\s*|\s*[\/·]\s*/).filter(x=>x.includes(p)&&!names.some(n=>x.includes(n)&&x.replace(new RegExp(n,'g'),'').indexOf(p)<0));
  sents.forEach(x=>out.push({d:m.date,t:x.trim()}))})});return out}
function peerBlock(p){const M=peerMentions(p);if(!M.length)return'';const pos=/좋|잘|최고|굿|훌륭|든든|대박|👍|칭찬|덕분/,neg=/아쉽|실수|못|부족|놓|느리|흔들/;
 const np=M.filter(x=>pos.test(x.t)).length,nn=M.filter(x=>neg.test(x.t)).length;
 return `<li style="opacity:.85"><b>동료 후기 언급 (주관적 의견 · 참고용)</b> — 익명 후기 ${M.length}건에서 언급${np||nn?` (긍정 ${np} · 아쉬움 ${nn})`:''}. 개인의 주관적 의견이며 객관적 평가가 아니라 분석 비중은 낮게 반영해요.${M.slice(-2).reverse().map(x=>`<br><span class="sub">· ${esc(x.d)} "${esc(x.t.slice(0,60))}"</span>`).join('')}</li>`}
{const _c=coach;coach=function(p,S){return _c(p,S)+peerBlock(p)}}

load();
